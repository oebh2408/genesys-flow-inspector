<text x="28" y="64" xml:space="preserve"><tspan fill="#6FF2C6">$</tspan></text>
<text x="44.86" y="64" fill="#F4F2EC" clip-path="url(#typed)" xml:space="preserve">npx flow-inspector lint examples/flows --inventory examples/inventory.json</text>
<text class="l0" x="28" y="85" xml:space="preserve"><tspan fill="#6FF2C6" >examples/flows/support-line.yaml</tspan></text>
<text class="l1" x="28" y="106" xml:space="preserve"><tspan fill="#8B86A0" >  13:3    </tspan><tspan fill="#A98BFF" >info    </tspan><tspan fill="#F4F2EC" >When an error occurs the flow disconnects without telling</tspan></text>
<text class="l2" x="28" y="127" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >the customer. Consider a short message or a transfer to a</tspan></text>
<text class="l3" x="28" y="148" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >fallback queue.</tspan><tspan fill="#8B86A0" >                                             </tspan><tspan fill="#8B86A0" >silent-error-handling</tspan></text>
<text class="l4" x="28" y="169" xml:space="preserve"><tspan fill="#8B86A0" >  38:13   </tspan><tspan fill="#FF7B8A" >error   </tspan><tspan fill="#F4F2EC" >Key 2 in menu 'Main Menu' is used by both 'Technical</tspan></text>
<text class="l5" x="28" y="190" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >support' and 'Order status'; only the first one is</tspan></text>
<text class="l6" x="28" y="211" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >reachable.</tspan><tspan fill="#8B86A0" >                                                  </tspan><tspan fill="#8B86A0" >duplicate-dtmf</tspan></text>
<text class="l7" x="28" y="232" xml:space="preserve"><tspan fill="#8B86A0" >  42:13   </tspan><tspan fill="#FF7B8A" >error   </tspan><tspan fill="#F4F2EC" >Reference '/inboundCall/tasks/task[Callbck_40]' does not</tspan></text>
<text class="l8" x="28" y="253" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >match any task, menu or state in this flow.</tspan><tspan fill="#8B86A0" >                 </tspan><tspan fill="#8B86A0" >unresolved-reference</tspan></text>
<text class="l9" x="28" y="274" xml:space="preserve"><tspan fill="#8B86A0" >  54:13   </tspan><tspan fill="#F2C46D" >warning </tspan><tspan fill="#F4F2EC" >'Look up account' does nothing on failure; the flow</tspan></text>
<text class="l10" x="28" y="295" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >continues as if the call had succeeded.</tspan><tspan fill="#8B86A0" >                     </tspan><tspan fill="#8B86A0" >unhandled-failure</tspan></text>
<text class="l11" x="28" y="316" xml:space="preserve"><tspan fill="#8B86A0" >  83:13   </tspan><tspan fill="#F2C46D" >warning </tspan><tspan fill="#F4F2EC" >The task 'Billing' reaches its end if the transfer</tspan></text>
<text class="l12" x="28" y="337" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >'Transfer to billing' fails. The interaction is</tspan></text>
<text class="l13" x="28" y="358" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >disconnected without a message.</tspan><tspan fill="#8B86A0" >                             </tspan><tspan fill="#8B86A0" >implicit-end</tspan></text>
<text class="l14" x="28" y="379" xml:space="preserve"><tspan fill="#8B86A0" >  113:13  </tspan><tspan fill="#F2C46D" >warning </tspan><tspan fill="#F4F2EC" >'Disconnect after order status' never runs: every path</tspan></text>
<text class="l15" x="28" y="400" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >before it ends earlier.</tspan><tspan fill="#8B86A0" >                                     </tspan><tspan fill="#8B86A0" >unreachable-action</tspan></text>
<text class="l16" x="28" y="421" xml:space="preserve"><tspan fill="#8B86A0" >  133:7   </tspan><tspan fill="#F2C46D" >warning </tspan><tspan fill="#F4F2EC" >The task 'Old Promotions' is never reached from the start</tspan></text>
<text class="l17" x="28" y="442" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >of the flow.</tspan><tspan fill="#8B86A0" >                                                </tspan><tspan fill="#8B86A0" >unreachable-block</tspan></text>
<text class="l18" x="28" y="463" xml:space="preserve"><tspan fill="#8B86A0" >  140:17  </tspan><tspan fill="#FF7B8A" >error   </tspan><tspan fill="#F4F2EC" >Prompt 'SummerPromo' is not in the inventory. Check the</tspan></text>
<text class="l19" x="28" y="484" xml:space="preserve"><tspan fill="#8B86A0" >                  </tspan><tspan fill="#F4F2EC" >name or create it before publishing.</tspan><tspan fill="#8B86A0" >                        </tspan><tspan fill="#8B86A0" >unknown-resource</tspan></text>
<text class="l21" x="28" y="526" xml:space="preserve"><tspan fill="#8B86A0" >2 files checked: </tspan><tspan fill="#FF7B8A" >3 errors</tspan><tspan fill="#8B86A0" >, </tspan><tspan fill="#F2C46D" >4 warnings</tspan><tspan fill="#8B86A0" >, </tspan><tspan fill="#A98BFF" >1 info</tspan></text>
